name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Committing the built site to the gh-pages branch, which is what Pages serves.
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Generate search index
        run: npm run postbuild

      # Pages is configured as "Deploy from a branch" → gh-pages, because the
      # PR-preview workflow needs its previews served from that branch. Under
      # that setting an upload-pages-artifact/deploy-pages job reports success
      # but is never served, so the built site has to be committed to the
      # branch instead.
      #
      # pr-preview/ is excluded from the clean step: it belongs to the preview
      # workflow, and wiping it here would take down every open PR's preview
      # on each deploy of main.
      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
