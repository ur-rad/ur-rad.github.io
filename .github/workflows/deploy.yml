name: Deploy to GitHub Pages

on:
  # Trigger the workflow every time you push to the `main` branch
  # Using a different branch name? Replace `main` with your branch's name
  push:
    branches: [main]
  # Allows you to run this workflow manually from the Actions tab on GitHub.
  workflow_dispatch:

# Serialized against the PR-preview workflow, which commits to the same branch.
# The deploy action force-pushes, so a concurrent preview run could otherwise be
# clobbered (or clobber this one) — merging a PR fires both at once. The group
# name is shared with preview.yml; concurrency groups are repo-wide, so the two
# workflows queue instead of racing. cancel-in-progress stays false so neither is
# interrupted mid-push.
concurrency:
  group: gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Committing the built site to gh-pages, which is what Pages serves.
    # Scoped to the job so any job added later starts with no write access.
    permissions:
      contents: write
    steps:
      - name: Checkout your repository using git
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Build site
        run: npm run build

      - name: Generate search index
        run: npm run postbuild

      # Pages is configured as "Deploy from a branch" → gh-pages, because the
      # PR-preview workflow needs its previews served from that branch. Under
      # that setting an upload-pages-artifact/deploy-pages job reports success
      # but is never served, so the built site has to be committed to the
      # branch instead.
      #
      # pr-preview/ is excluded from the clean step: it belongs to the preview
      # workflow, and wiping it here would take down every open PR's preview
      # on each deploy of main.
      - name: Deploy to the gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist
          branch: gh-pages
          clean: true
          clean-exclude: |
            pr-preview/
